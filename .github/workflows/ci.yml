name: CI

on:
  # A PR gets exactly one validation, not one for each branch push as well.
  push:
    branches: [main]
  pull_request:
  # Release calls this same validation; never cancel its verification job.
  workflow_call:
  workflow_dispatch:

# Supersede obsolete checks only for the same PR. Main and Release checks
# each use their unique run ID, so no new push can cancel a publishing gate.
concurrency:
  group: cyris-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Optional isolated Linux runner for private-repo Actions budget/runner incidents.
    # GitHub variable CYRIS_CI_RUNNER defaults to the standard hosted runner.
    # Do not execute untrusted PR code on a production or long-lived host.
    runs-on: ${{ vars.CYRIS_CI_RUNNER || 'ubuntu-latest' }}
    # Hard stop for stalled regressions and failed runner environments.
    # This bounds the reusable Release preflight, not the image publishing job.
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cyris_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: cyris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyris_test -d cyris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CYRIS_TEST_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_test
      POSTGRES_PASSWORD: local-ci-only
      CYRIS_TEST_DATABASE_URL: postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_test
      CYRIS_TEST_DATABASE_ISOLATED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployment control utility is executable
        run: test -x deploy/cyrisctl

      - name: Validate release version consistency
        run: node scripts/check-version.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run regression tests
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm test:run

      - name: Rehearse retention object recovery on disposable MinIO
        run: |
          set -euo pipefail
          name="cyris-retention-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          storage_image="$(docker compose -f deploy/compose.prod.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["minio"]["image"])')"
          [[ "$storage_image" =~ @sha256:[a-f0-9]{64}$ ]]
          docker run -d --name "$name" -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=cyris-test-only -e MINIO_ROOT_PASSWORD=local-ci-storage-only "$storage_image" server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:19000/minio/health/ready >/dev/null
          CYRIS_TEST_S3_ISOLATED=true CYRIS_TEST_S3_ENDPOINT=http://127.0.0.1:19000 pnpm exec tsx --test apps/api/src/scripts/retention-object-recovery.test.ts

      - name: Rehearse exercise search reconciliation on disposable Typesense
        run: |
          set -euo pipefail
          name="cyris-search-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          image="$(docker compose -f deploy/compose.prod.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["typesense"]["image"])')"
          docker run -d --name "$name" -p 127.0.0.1:18108:8108 "$image" --data-dir=/tmp --api-key=cyris-test-search-only
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18108/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18108/health >/dev/null
          CYRIS_TEST_TYPESENSE_ISOLATED=true CYRIS_TEST_TYPESENSE_ENDPOINT=http://127.0.0.1:18108 pnpm exec tsx --test apps/api/src/scripts/retention-search.test.ts

      - name: Rehearse committed cross-service exercise reset and removal
        run: |
          set -euo pipefail
          storage="cyris-committed-s3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          search="cyris-committed-search-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$storage" "$search" >/dev/null 2>&1 || true' EXIT
          docker exec "${{ job.services.postgres.id }}" createdb -U cyris_test cyris_retention_committed
          export DATABASE_URL=postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_retention_committed
          export CYRIS_TEST_DATABASE_URL="$DATABASE_URL"
          pnpm db:migrate
          storage_image="$(docker compose -f deploy/compose.prod.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["minio"]["image"])')"
          search_image="$(docker compose -f deploy/compose.prod.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["typesense"]["image"])')"
          [[ "$storage_image" =~ @sha256:[a-f0-9]{64}$ ]]
          docker run -d --name "$storage" -p 127.0.0.1:19001:9000 -e MINIO_ROOT_USER=cyris-test-only -e MINIO_ROOT_PASSWORD=local-ci-storage-only "$storage_image" server /data
          docker run -d --name "$search" -p 127.0.0.1:18109:8108 "$search_image" --data-dir=/tmp --api-key=cyris-test-search-only
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19001/minio/health/ready >/dev/null && curl -fsS http://127.0.0.1:18109/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:19001/minio/health/ready >/dev/null
          curl -fsS http://127.0.0.1:18109/health >/dev/null
          CYRIS_TEST_RETENTION_COMMITTED=true CYRIS_TEST_S3_ENDPOINT=http://127.0.0.1:19001 CYRIS_TEST_TYPESENSE_ENDPOINT=http://127.0.0.1:18109 pnpm exec tsx --test apps/api/src/scripts/retention-finish.test.ts

      - name: Rehearse populated schema upgrades from 2.4.22 and 2.5.1
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" createdb -U cyris_test -T template0 cyris_upgrade_2422
          docker exec "${{ job.services.postgres.id }}" createdb -U cyris_test -T template0 cyris_upgrade_251
          CYRIS_TEST_RETENTION_UPGRADE=true pnpm exec tsx --test packages/db/src/retention-upgrade.test.ts

      - name: Real browser release smoke with populated admin and participant
        run: |
          set -euo pipefail
          storage="cyris-browser-s3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          search="cyris-browser-search-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temp="$(mktemp -d)"
          export CYRIS_BROWSER_ARTIFACTS="$RUNNER_TEMP/cyris-browser-evidence"
          mkdir -p "$CYRIS_BROWSER_ARTIFACTS"
          api_pid="" web_pid=""
          cleanup() {
            if [[ -n "$api_pid" ]]; then kill "$api_pid" 2>/dev/null || true; fi
            if [[ -n "$web_pid" ]]; then kill "$web_pid" 2>/dev/null || true; fi
            docker rm -f "$storage" "$search" >/dev/null 2>&1 || true
            rm -rf "$temp"
          }
          trap cleanup EXIT
          docker exec "${{ job.services.postgres.id }}" createdb -U cyris_test -T template0 cyris_browser_smoke
          export DATABASE_URL=postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_browser_smoke
          export REDIS_URL=redis://127.0.0.1:6379/13
          export NODE_ENV=development CYRIS_VERSION=2.5.2 PORT=4000 PUBLIC_WEB_URL=http://127.0.0.1:3000
          export CYRIS_MASTER_KEY="$(openssl rand -hex 32)"
          export TYPESENSE_HOST=127.0.0.1 TYPESENSE_PORT=18110 TYPESENSE_API_KEY=cyris-browser-search-only
          export S3_ENDPOINT=http://127.0.0.1:19002 S3_ACCESS_KEY=cyris-test-only S3_SECRET_KEY=local-ci-storage-only
          export CYRIS_BROWSER_FIXTURE_PATH="$temp/fixture.json"
          export CYRIS_BROWSER_FIXTURE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$CYRIS_BROWSER_FIXTURE_PASSWORD"
          echo "::add-mask::$CYRIS_MASTER_KEY"
          storage_image="$(docker compose -f deploy/compose.prod.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["minio"]["image"])')"
          search_image="$(docker compose -f deploy/compose.prod.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["typesense"]["image"])')"
          docker run -d --name "$storage" -p 127.0.0.1:19002:9000 -e MINIO_ROOT_USER=cyris-test-only -e MINIO_ROOT_PASSWORD=local-ci-storage-only "$storage_image" server /data
          docker run -d --name "$search" -p 127.0.0.1:18110:8108 "$search_image" --data-dir=/tmp --api-key=cyris-browser-search-only
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19002/minio/health/ready >/dev/null && curl -fsS http://127.0.0.1:18110/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:19002/minio/health/ready >/dev/null
          curl -fsS http://127.0.0.1:18110/health >/dev/null
          pnpm db:migrate
          pnpm exec tsx scripts/browser-release-fixture.ts
          npm install --prefix "$temp" --no-audit --no-fund --ignore-scripts --no-package-lock playwright@1.51.1
          "$temp/node_modules/.bin/playwright" install --with-deps chromium
          export CYRIS_BROWSER_PLAYWRIGHT_PATH="$temp/node_modules/playwright/index.mjs"
          node apps/api/dist/main.js >"$temp/api.log" 2>&1 & api_pid=$!
          node apps/web/node_modules/next/dist/bin/next start apps/web -p 3000 -H 127.0.0.1 >"$temp/web.log" 2>&1 & web_pid=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/health/ready >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4000/health/ready >/dev/null || { tail -n 40 "$temp/api.log"; exit 1; }
          curl -fsS http://127.0.0.1:3000/ >/dev/null || { tail -n 40 "$temp/web.log"; exit 1; }
          node scripts/browser-release-smoke.mjs

      - name: Upload browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyris-browser-release-evidence
          path: ${{ runner.temp }}/cyris-browser-evidence/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Check diff
        run: git diff --check

      - name: Validate deployment scripts
        run: |
          for script in deploy/*.sh scripts/start-dev.sh scripts/dev-status.sh scripts/dev-runtime.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy/tests -v
          node --check scripts/dev-apps.mjs
          ./deploy/install.sh --help
          python3 ./deploy/cyrisctl --help
          docker compose -f deploy/compose.prod.yml config > /dev/null

      - name: Restore encrypted backup on an isolated Compose project
        run: sudo env GITHUB_ACTIONS=true GITHUB_RUN_ID="$GITHUB_RUN_ID" bash deploy/tests/recovery-smoke.sh
