name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Exercise policy and workspace tests
        run: |
          pnpm exec tsx --test \
            apps/api/src/modules/auth/view-as-policy.test.ts \
            apps/api/src/modules/disruptions/service-status-policy.test.ts \
            apps/api/src/modules/disruptions/disruption-policy.test.ts \
            apps/api/src/modules/disruptions/recovery-policy.test.ts \
            apps/api/src/modules/command/defcon-policy.test.ts \
            apps/api/src/modules/support/support-policy.test.ts \
            apps/api/src/modules/laboratory/laboratory-assignment.test.ts \
            apps/api/src/regression/scenario-designer.test.ts \
            apps/api/src/regression/scenario-progression.test.ts \
            apps/web/src/components/command/defcon-live.test.ts \
            apps/web/src/lib/workspace-navigation.test.ts \
            packages/contracts/src/command-defcon.test.ts

      - name: Check diff
        run: git diff --check

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh
          ./deploy/install.sh --help
          python3 ./deploy/cyrisctl --help
          docker compose -f deploy/compose.prod.yml config > /dev/null
