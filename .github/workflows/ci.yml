name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cyris_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: cyris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyris_test -d cyris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_test
      POSTGRES_PASSWORD: local-ci-only
      CYRIS_TEST_DATABASE_URL: postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_test
      CYRIS_TEST_DATABASE_ISOLATED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run regression tests
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm test:run

      - name: Check diff
        run: git diff --check

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh scripts/start-dev.sh scripts/dev-status.sh scripts/dev-runtime.sh
          node --check scripts/dev-apps.mjs
          ./deploy/install.sh --help
          python3 ./deploy/cyrisctl --help
          docker compose -f deploy/compose.prod.yml config > /dev/null
