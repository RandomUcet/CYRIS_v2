name: CI

on:
  # A PR gets exactly one validation, not one for each branch push as well.
  push:
    branches: [main]
  pull_request:
  # Release calls this same validation; never cancel its verification job.
  workflow_call:
  workflow_dispatch:

# Supersede obsolete checks only for the same PR. Main and Release checks
# each use their unique run ID, so no new push can cancel a publishing gate.
concurrency:
  group: cyris-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Optional isolated Linux runner for private-repo Actions budget/runner incidents.
    # GitHub variable CYRIS_CI_RUNNER defaults to the standard hosted runner.
    # Do not execute untrusted PR code on a production or long-lived host.
    runs-on: ${{ vars.CYRIS_CI_RUNNER || 'ubuntu-latest' }}
    # Hard stop for stalled regressions and failed runner environments.
    # This bounds the reusable Release preflight, not the image publishing job.
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cyris_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: cyris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyris_test -d cyris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_test
      POSTGRES_PASSWORD: local-ci-only
      CYRIS_TEST_DATABASE_URL: postgresql://cyris_test:local-ci-only@127.0.0.1:5432/cyris_test
      CYRIS_TEST_DATABASE_ISOLATED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployment control utility is executable
        run: test -x deploy/cyrisctl

      - name: Validate release version consistency
        run: node scripts/check-version.mjs

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run regression tests
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm test:run

      - name: Check diff
        run: git diff --check

      - name: Validate deployment scripts
        run: |
          for script in deploy/*.sh scripts/start-dev.sh scripts/dev-status.sh scripts/dev-runtime.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy/tests -v
          node --check scripts/dev-apps.mjs
          ./deploy/install.sh --help
          python3 ./deploy/cyrisctl --help
          docker compose -f deploy/compose.prod.yml config > /dev/null

      - name: Restore encrypted backup on an isolated Compose project
        run: sudo env GITHUB_ACTIONS=true GITHUB_RUN_ID="$GITHUB_RUN_ID" bash deploy/tests/recovery-smoke.sh
