name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check diff
        run: git diff --check

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          REPO_OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lower=${REPO_OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Build and push CYRIS API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-api:latest

      - name: Build and push CYRIS Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-worker:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-worker:latest

      - name: Build and push CYRIS Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-web:latest

      - name: Generate Release Manifest
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          OWNER="${{ steps.meta.outputs.owner_lower }}"
          cat <<EOF > release-manifest.json
          {
            "version": "${VERSION}",
            "minCyrisctlVersion": "2.0.0",
            "supportedOs": ["ubuntu-24.04"],
            "releaseDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "migrationsRequired": true,
            "searchReindexRequired": false,
            "breaking": false,
            "requiredConfigKeys": [
              "CYRIS_MASTER_KEY",
              "POSTGRES_PASSWORD",
              "TYPESENSE_API_KEY",
              "S3_SECRET_KEY"
            ],
            "images": {
              "api": "ghcr.io/${OWNER}/cyris-api:${VERSION}",
              "worker": "ghcr.io/${OWNER}/cyris-worker:${VERSION}",
              "web": "ghcr.io/${OWNER}/cyris-web:${VERSION}"
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-manifest.json
            deploy/cyrisctl
            deploy/install.sh
            deploy/compose.prod.yml
          draft: false
          prerelease: false
          generate_release_notes: true
