name: Release

on:
  push:
    branches: [main]
    paths: [deploy/VERSION]
  workflow_dispatch:

concurrency:
  group: cyris-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat deploy/VERSION)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
          git fetch --tags
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Version v$VERSION already tagged. Select a new version." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          REPO_OWNER_LOWER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lower=${REPO_OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Build and push CYRIS API image
        id: api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-api:${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push CYRIS Worker image
        id: worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-worker:${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push CYRIS Web image
        id: web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-web:${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Generate Release Manifest
        run: |
          python3 - <<EOF
          import json
          from datetime import datetime, timezone

          version = "${{ steps.meta.outputs.version }}"
          owner = "${{ steps.meta.outputs.owner_lower }}"

          manifest = {
              "version": version,
              "minCyrisctlVersion": "2.0.1",
              "commit": "${{ github.sha }}",
              "supportedOs": ["ubuntu-24.04"],
              "releaseDate": datetime.now(timezone.utc).isoformat(),
              "migrationsRequired": True,
              "searchReindexRequired": False,
              "breaking": False,
              "requiredConfigKeys": [
                  "CYRIS_MASTER_KEY",
                  "POSTGRES_PASSWORD",
                  "TYPESENSE_API_KEY",
                  "S3_SECRET_KEY"
              ],
              "images": {
                  "api": f"ghcr.io/{owner}/cyris-api@${{ steps.api.outputs.digest }}",
                  "worker": f"ghcr.io/{owner}/cyris-worker@${{ steps.worker.outputs.digest }}",
                  "web": f"ghcr.io/{owner}/cyris-web@${{ steps.web.outputs.digest }}"
              }
          }

          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            release-manifest.json
            deploy/cyrisctl
            deploy/install.sh
            deploy/compose.prod.yml
          draft: false
          prerelease: false
          generate_release_notes: true
