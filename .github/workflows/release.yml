name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [deploy/VERSION, deploy/release-retry]
  workflow_dispatch:

concurrency:
  group: cyris-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    permissions:
      contents: write
      packages: write
    # Publish on an isolated trusted Linux runner if the hosted runner cannot
    # be allocated. Set CYRIS_RELEASE_RUNNER; keep it separate from the PR CI VM.
    runs-on: ${{ vars.CYRIS_RELEASE_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat deploy/VERSION)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
          # Do not publish stable images with pre-release application version metadata.
          if [[ "$(cat VERSION)" != "$VERSION" ]]; then
            echo "Root VERSION must match deploy/VERSION for stable release." >&2
            exit 1
          fi
          git fetch --unshallow --tags origin main
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            [[ $GITHUB_REF_NAME == "v$VERSION" ]]
            git merge-base --is-ancestor HEAD FETCH_HEAD
            # Prevent a rerun from replacing an existing release.
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/cyris-tags"
            if grep -Fxq "v$VERSION" "$RUNNER_TEMP/cyris-tags"; then exit 1; fi
          elif git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Version v$VERSION already tagged. Select a new version." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          REPO_OWNER_LOWER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lower=${REPO_OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Build and push CYRIS API image
        id: api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Reuse immutable Docker build layers across releases on main.
          # A unique scope per image prevents eviction/overwrite collisions.
          cache-from: type=gha,scope=cyris-api-stable
          cache-to: type=gha,mode=max,scope=cyris-api-stable,ignore-error=true
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-api:${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push CYRIS Worker image
        id: worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Reuse immutable Docker build layers across releases on main.
          # A unique scope per image prevents eviction/overwrite collisions.
          cache-from: type=gha,scope=cyris-worker-stable
          cache-to: type=gha,mode=max,scope=cyris-worker-stable,ignore-error=true
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-worker:${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push CYRIS Web image
        id: web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          # Reuse immutable Docker build layers across releases on main.
          # A unique scope per image prevents eviction/overwrite collisions.
          cache-from: type=gha,scope=cyris-web-stable
          cache-to: type=gha,mode=max,scope=cyris-web-stable,ignore-error=true
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/cyris-web:${{ steps.meta.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify every published image digest and both server architectures
        env:
          OWNER: ${{ steps.meta.outputs.owner_lower }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          for entry in "api:$API_DIGEST" "worker:$WORKER_DIGEST" "web:$WEB_DIGEST"; do
            name="${entry%%:*}"
            digest="${entry#*:}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid $name digest" >&2; exit 1; }
            manifest="$RUNNER_TEMP/cyris-$name-multiarch.json"
            docker buildx imagetools inspect "ghcr.io/$OWNER/cyris-$name@$digest" --raw > "$manifest"
            python3 - "$manifest" "$name" <<'PY'
          import json, sys
          manifest=json.load(open(sys.argv[1], encoding="utf-8"))
          platforms={(entry.get("platform", {}).get("os"), entry.get("platform", {}).get("architecture"))
                     for entry in manifest.get("manifests", [])}
          required={("linux", "amd64"), ("linux", "arm64")}
          missing=required-platforms
          if missing:
              raise SystemExit(f"Missing supported platforms for {sys.argv[2]}: {sorted(missing)}")
          print(f"Verified {sys.argv[2]}: linux/amd64 and linux/arm64")
          PY
          done
      - name: Generate Release Manifest
        run: |
          python3 - <<EOF
          import json
          from datetime import datetime, timezone

          version = "${{ steps.meta.outputs.version }}"
          owner = "${{ steps.meta.outputs.owner_lower }}"

          manifest = {
              "version": version,
              "minCyrisctlVersion": "2.0.1",
              "commit": "${{ github.sha }}",
              "supportedOs": ["ubuntu-24.04"],
              "releaseDate": datetime.now(timezone.utc).isoformat(),
              "migrationsRequired": True,
              "searchReindexRequired": False,
              "breaking": False,
              "requiredConfigKeys": [
                  "CYRIS_MASTER_KEY",
                  "POSTGRES_PASSWORD",
                  "TYPESENSE_API_KEY",
                  "S3_SECRET_KEY"
              ],
              "images": {
                  "api": f"ghcr.io/{owner}/cyris-api@${{ steps.api.outputs.digest }}",
                  "worker": f"ghcr.io/{owner}/cyris-worker@${{ steps.worker.outputs.digest }}",
                  "web": f"ghcr.io/{owner}/cyris-web@${{ steps.web.outputs.digest }}"
              }
          }

          with open("release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          EOF

      - name: Package Ubuntu installer with matching image references
        run: |
          bundle=$(mktemp -d)
          mkdir -p "$bundle/deploy" "$bundle/docker/postgres"
          cp deploy/{install.sh,cyrisctl,compose.prod.yml,cyris.env.template,Provoz.md} "$bundle/deploy/"
          cp docker/postgres/01-init-pgvector.sql "$bundle/docker/postgres/"
          cp release-manifest.json "$bundle/deploy/"
          python3 - "$bundle/deploy" <<'PYTHON'
          import json, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          release = json.loads((directory / "release-manifest.json").read_text())
          template = directory / "cyris.env.template"
          lines = [line for line in template.read_text().splitlines() if not line.startswith("CYRIS_VERSION=")]
          lines.append("CYRIS_VERSION=" + release["version"])
          lines.extend(f"CYRIS_{s.upper()}_IMAGE={image}" for s, image in release["images"].items())
          template.write_text("\n".join(lines) + "\n")
          PYTHON
          tar -C "$bundle" -czf cyris-ubuntu.tar.gz deploy docker

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            release-manifest.json
            cyris-ubuntu.tar.gz
            deploy/cyrisctl
            deploy/install.sh
            deploy/compose.prod.yml
          draft: false
          prerelease: false
          generate_release_notes: true
