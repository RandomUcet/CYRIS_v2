name: cyris-prod

services:
  gateway:
    profiles: ["lan-https"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /opt/cyris/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/cyris/caddy:/data
    networks:
      - cyris-internal

  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector (Primary Source of Truth)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cyris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyris}
      POSTGRES_USER: ${POSTGRES_USER:-cyris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/cyris/postgres:/var/lib/postgresql/data
      - /opt/cyris/docker/postgres/01-init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyris} -d ${POSTGRES_DB:-cyris}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyris-internal

  # ----------------------------------------------------------------------------
  # 2. Redis (BullMQ, Background Processing, Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyris-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /var/lib/cyris/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - cyris-internal

  # ----------------------------------------------------------------------------
  # 3. Typesense (Global Search & Indexing Engine)
  # ----------------------------------------------------------------------------
  typesense:
    image: typesense/typesense:27.1
    container_name: cyris-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - /var/lib/cyris/typesense:/data
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8108 && echo -e 'GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'ok'"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyris-internal

  # ----------------------------------------------------------------------------
  # 4. S3 Object Storage / MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: pgsty/silo:latest@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    container_name: cyris-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - /var/lib/cyris/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cyris-internal

  # MinIO Bucket Provisioner (One-shot initialization container)
  minio-init:
    image: pgsty/mc:latest@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    container_name: cyris-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set cyris http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing cyris/$${S3_BUCKET} &&
      /usr/bin/mc mb --ignore-existing cyris/$${S3_AUDIT_BUCKET:-cyris-audit} &&
      echo 'Buckets $${S3_BUCKET} and $${S3_AUDIT_BUCKET:-cyris-audit} verified/created.' &&
      exit 0;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-cyris-storage}
      S3_AUDIT_BUCKET: ${S3_AUDIT_BUCKET:-cyris-audit}
    networks:
      - cyris-internal
    restart: "no"

  # ----------------------------------------------------------------------------
  # 5. CYRIS API Server (NestJS / Fastify)
  # ----------------------------------------------------------------------------
  api:
    image: ${CYRIS_API_IMAGE:-ghcr.io/randomucet/cyris-api:${CYRIS_VERSION:-0.1.0}}
    container_name: cyris-api
    volumes:
      - /etc/cyris/api-ca:/run/cyris-ca:ro
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CYRIS_API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_EXTRA_CA_CERTS: ${CYRIS_API_EXTRA_CA_CERTS:-}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB:-cyris}
      POSTGRES_USER: ${POSTGRES_USER:-cyris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CYRIS_HEALTH_MONITOR: ${CYRIS_HEALTH_MONITOR:-false}
      CYRIS_AI_MAX_CONCURRENT: ${CYRIS_AI_MAX_CONCURRENT:-2}
      CYRIS_AI_MAX_WAIT_MS: ${CYRIS_AI_MAX_WAIT_MS:-8000}
      CYRIS_AI_MAX_PENDING: ${CYRIS_AI_MAX_PENDING:-16}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT: ${TYPESENSE_PORT:-8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cyris-storage}
      S3_AUDIT_BUCKET: ${S3_AUDIT_BUCKET:-cyris-audit}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      CYRIS_MASTER_KEY: ${CYRIS_MASTER_KEY}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CYRIS_VERSION: ${CYRIS_VERSION:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cyris-internal

  # ----------------------------------------------------------------------------
  # 6. CYRIS Background Worker (NestJS / BullMQ)
  # ----------------------------------------------------------------------------
  worker:
    image: ${CYRIS_WORKER_IMAGE:-ghcr.io/randomucet/cyris-worker:${CYRIS_VERSION:-0.1.0}}
    container_name: cyris-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB:-cyris}
      POSTGRES_USER: ${POSTGRES_USER:-cyris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT: ${TYPESENSE_PORT:-8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cyris-storage}
      S3_AUDIT_BUCKET: ${S3_AUDIT_BUCKET:-cyris-audit}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      CYRIS_MASTER_KEY: ${CYRIS_MASTER_KEY}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CYRIS_VERSION: ${CYRIS_VERSION:-}
    healthcheck:
      test: ["CMD", "node", "-e", "const s=JSON.parse(require('fs').readFileSync('/tmp/cyris-worker-health.json','utf8'));const n=Date.now();if(!Number.isInteger(s.pid)||s.pid<=0)process.exit(1);process.kill(s.pid,0);process.exit(n-s.heartbeatAt>=-5000&&n-s.heartbeatAt<=30000&&n-s.scenarioSettledAt>=-5000&&n-s.scenarioSettledAt<=180000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - cyris-internal

  # ----------------------------------------------------------------------------
  # 7. CYRIS Web (Next.js 14)
  # ----------------------------------------------------------------------------
  web:
    image: ${CYRIS_WEB_IMAGE:-ghcr.io/randomucet/cyris-web:${CYRIS_VERSION:-0.1.0}}
    container_name: cyris-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CYRIS_WEB_BIND:-0.0.0.0}:${CYRIS_HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /api
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CYRIS_VERSION: ${CYRIS_VERSION:-}
      NEXT_PUBLIC_CYRIS_VERSION: ${CYRIS_VERSION:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (res) => (res.statusCode >= 200 && res.statusCode < 400) ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cyris-internal

networks:
  cyris-internal:
    name: cyris-internal
    driver: bridge
